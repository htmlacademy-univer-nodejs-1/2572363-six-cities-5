version: '3.9'
services:
  mongodb:
    image: mongo:latest
    container_name: six-cities-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
  db_ui:
    image: mongo-express:latest
    restart: always
    container_name: six-cities_mongo_express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_EXPRESS_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_EXPRESS_PASSWORD}
      ME_CONFIG_MONGODB_URL: "mongodb://${DB_EXPRESS_USER}:${DB_EXPRESS_PASSWORD}@db:27017/"

volumes:
  mongodb_data:
