openapi: 3.0.3
info:
  title: API сервиса «Шесть городов»
  description: REST API для сервиса аренды жилья в шести европейских городах
  version: 1.1.0

paths:
  /users/register:
    post:
      tags:
        - users
      summary: Создание нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        201:
          description: Успешное создание нового пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Некорректная валидация
        409:
          description: Пользователь с таким email уже существует

  /users/login:
    post:
      tags:
        - users
      summary: Вход в закрытую часть приложения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUser'
      responses:
        200:
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT токен для авторизации
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Неверный логин или пароль

    get:
      tags:
        - users
      summary: Проверка состояния пользователя
      security:
        - bearerAuth: []
      responses:
        200:
          description: Успешная проверка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Неавторизованный пользователь

  /users/{userId}/avatar:
    post:
      tags:
        - users
      summary: Загрузка аватара пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Файл аватара
      responses:
        200:
          description: Аватар успешно загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Файл не загружен
        401:
          description: Не авторизован
        404:
          description: Пользователь не найден

  /offers:
    get:
      tags:
        - offers
      summary: Список предложений по аренде
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 60
          description: Количество возвращаемых предложений
        - name: city
          in: query
          schema:
            type: string
            enum: [Paris, Cologne, Brussels, Amsterdam, Hamburg, Dusseldorf]
          description: Фильтр по городу
      responses:
        200:
          description: Успешно получен список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferShort'

    post:
      tags:
        - offers
      summary: Создание нового предложения
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOffer'
      responses:
        201:
          description: Новое предложение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferFull'
        400:
          description: Некорректная валидация
        401:
          description: Не авторизован

  /offers/{offerId}:
    get:
      tags:
        - offers
      summary: Детальная информация по предложению
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Детальная информация по предложению успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferFull'
        404:
          description: Предложение не найдено

    put:
      tags:
        - offers
      summary: Редактирование предложения
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOffer'
      responses:
        200:
          description: Предложение успешно отредактировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferFull'
        400:
          description: Некорректная валидация
        401:
          description: Не авторизован
        403:
          description: Нет прав для редактирования (не ваш offer)
        404:
          description: Предложение не найдено

    delete:
      tags:
        - offers
      summary: Удаление предложения по аренде
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Предложение успешно удалено
        401:
          description: Не авторизован
        403:
          description: Нет прав для удаления (не ваш offer)
        404:
          description: Предложение не найдено

  /offers/premium_by_city/{city}:
    get:
      tags:
        - offers
      summary: Премиальные предложения для города
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
            enum: [ Paris, Cologne, Brussels, Amsterdam, Hamburg, Dusseldorf ]
      responses:
        200:
          description: Возвращает не более 3 премиальных предложения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferShort'
        400:
          description: Некорректный город

  /offers/{offerId}/comments:
    get:
      tags:
        - comments
      summary: Список комментариев для предложения
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Список комментариев для предложения успешно получен (до 50 комментариев)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        404:
          description: Предложение не найдено

    post:
      tags:
        - comments
      summary: Добавление комментария
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
      responses:
        201:
          description: Успешное добавление комментария
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        400:
          description: Некорректная валидация
        401:
          description: Не авторизован
        404:
          description: Предложение не найдено

  /favorites:
    get:
      tags:
        - offers
      summary: Список избранных предложений
      security:
        - bearerAuth: []
      responses:
        200:
          description: Возвращает список избранных предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferShort'
        401:
          description: Не авторизован

  /favorites/{offerId}:
    post:
      tags:
        - offers
      summary: Добавление предложения в избранное
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Добавление прошло успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  offerId:
                    type: string
        401:
          description: Не авторизован
        404:
          description: Предложение не найдено

    delete:
      tags:
        - offers
      summary: Удаление предложения из избранного
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Удаление прошло успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  offerId:
                    type: string
        401:
          description: Не авторизован
        404:
          description: Предложение не найдено

tags:
  - name: users
    description: Для действий с пользователями
  - name: offers
    description: Действия с предложениями
  - name: comments
    description: Действия с комментариями

securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT

components:
  schemas:
    CreateUser:
      type: object
      required: [name, email, password, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: "Иван Иванов"
        email:
          type: string
          format: email
          example: "ivan@example.com"
        password:
          type: string
          minLength: 6
          maxLength: 12
          example: "password123"
        avatar:
          type: string
          example: "default-avatar.jpg"
        type:
          type: string
          enum: [ordinary, pro]
          example: "pro"

    LoginUser:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "ivan@example.com"
        password:
          type: string
          example: "password123"

    User:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "Иван Иванов"
        email:
          type: string
          example: "ivan@example.com"
        avatar:
          type: string
          example: "default-avatar.jpg"
        type:
          type: string
          example: "pro"

    CreateOffer:
      type: object
      required: [title, description, publishedDate, city, previewImage, images, isPremium, type, bedrooms, maxAdults, price, goods, commentsCount, latitude, longitude]
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
          example: "Beautiful & luxurious apartment"
        description:
          type: string
          minLength: 20
          maxLength: 1024
          example: "A quiet cozy and picturesque apartment"
        publishedDate:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        city:
          type: string
          enum: [Paris, Cologne, Brussels, Amsterdam, Hamburg, Dusseldorf]
          example: "Amsterdam"
        previewImage:
          type: string
          example: "img/apartment-01.jpg"
        images:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
          example: ["img/apartment-01.jpg", "img/apartment-02.jpg", "img/apartment-03.jpg", "img/room.jpg", "img/studio-01.jpg", "img/apartment-01.jpg"]
        isPremium:
          type: boolean
          example: true
        type:
          type: string
          enum: [apartment, house, room, hotel]
          example: "apartment"
        bedrooms:
          type: integer
          minimum: 1
          maximum: 8
          example: 3
        maxAdults:
          type: integer
          minimum: 1
          maximum: 10
          example: 4
        price:
          type: integer
          minimum: 100
          maximum: 100000
          example: 120
        goods:
          type: array
          items:
            type: string
            enum: [Breakfast, "Air conditioning", "Laptop friendly workspace", "Baby seat", Washer, Towels, Fridge]
          example: ["Breakfast", "Air conditioning"]
        commentsCount:
          type: integer
          minimum: 0
          example: 0
        latitude:
          type: number
          example: 52.370216
        longitude:
          type: number
          example: 4.895168

    UpdateOffer:
      type: object
      properties:
        title:
          type: string
          minLength: 10
          maxLength: 100
          example: "Updated apartment title"
        description:
          type: string
          minLength: 20
          maxLength: 1024
          example: "Updated description"
        previewImage:
          type: string
          example: "img/updated-preview.jpg"
        images:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
        isPremium:
          type: boolean
          example: false
        type:
          type: string
          enum: [apartment, house, room, hotel]
        bedrooms:
          type: integer
          minimum: 1
          maximum: 8
        maxAdults:
          type: integer
          minimum: 1
          maximum: 10
        price:
          type: integer
          minimum: 100
          maximum: 100000
        goods:
          type: array
          items:
            type: string
            enum: ["Breakfast", "Air conditioning", "Laptop friendly workspace", "Baby seat", "Washer", "Towels", "Fridge"]

    OfferShort:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439012"
        title:
          type: string
          example: "Beautiful & luxurious apartment"
        city:
          type: string
          example: "Amsterdam"
        previewImage:
          type: string
          example: "img/apartment-01.jpg"
        isPremium:
          type: boolean
          example: true
        rating:
          type: number
          minimum: 1
          maximum: 5
          example: 4.8
        type:
          type: string
          example: "apartment"
        price:
          type: integer
          example: 120
        isFavorite:
          type: boolean
          example: true
        commentsCount:
          type: integer
          example: 5

    OfferFull:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439012"
        title:
          type: string
          example: "Beautiful & luxurious apartment"
        description:
          type: string
          example: "A quiet cozy and picturesque apartment"
        city:
          type: string
          example: "Amsterdam"
        previewImage:
          type: string
          example: "img/apartment-01.jpg"
        images:
          type: array
          items:
            type: string
          example: ["img/apartment-01.jpg", "img/apartment-02.jpg", "img/apartment-03.jpg"]
        isPremium:
          type: boolean
          example: true
        rating:
          type: number
          example: 4.8
        type:
          type: string
          example: "apartment"
        bedrooms:
          type: integer
          example: 3
        maxAdults:
          type: integer
          example: 4
        price:
          type: integer
          example: 120
        goods:
          type: array
          items:
            type: string
          example: ["Breakfast", "Air conditioning"]
        author:
          $ref: '#/components/schemas/User'
        commentsCount:
          type: integer
          example: 5
        latitude:
          type: number
          example: 52.370216
        longitude:
          type: number
          example: 4.895168
        isFavorite:
          type: boolean
          example: true

    CreateComment:
      type: object
      required: [text, rating]
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 1024
          example: "A quiet cozy and picturesque apartment"
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4

    Comment:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439013"
        text:
          type: string
          example: "A quiet cozy and picturesque apartment"
        rating:
          type: integer
          example: 4
        author:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
          example: "2023-04-09T12:00:00Z"
